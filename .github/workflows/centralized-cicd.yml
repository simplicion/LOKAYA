name: Centralized CI/CD Pipeline (AWS, GHCR and Cloudflare)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'Dockerfile*'
      - 'docker-compose*'
      - 'docker-entrypoint.sh'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'Dockerfile*'
      - 'docker-compose*'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  workflow_dispatch:
    inputs:
      target:
        description: 'Component to Deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - user-app
          - admin-app
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read
  packages: write
  pull-requests: write
  id-token: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/lokaya-backend
  USER_APP_IMAGE_NAME: ${{ github.repository_owner }}/lokaya-user-app
  ADMIN_APP_IMAGE_NAME: ${{ github.repository_owner }}/lokaya-admin-web
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
  CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}

jobs:
  # ============================================================================
  # 1. CHANGE DETECTION AND PATH FILTERING
  # ============================================================================
  detect-changes:
    name: Detect Monorepo Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event.inputs.target == 'backend' || github.event.inputs.target == 'all' }}
      user_app: ${{ steps.filter.outputs.user_app == 'true' || github.event.inputs.target == 'user-app' || github.event.inputs.target == 'all' }}
      admin_app: ${{ steps.filter.outputs.admin_app == 'true' || github.event.inputs.target == 'admin-app' || github.event.inputs.target == 'all' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter Path Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/**'
              - 'Dockerfile.backend'
              - 'docker-entrypoint.sh'
              - 'docker-compose*'
              - '.dockerignore'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
            user_app:
              - 'apps/user-app/**'
              - 'packages/**'
              - 'Dockerfile.user-app'
              - 'docker-compose*'
              - '.dockerignore'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
            admin_app:
              - 'apps/admin-web/**'
              - 'packages/**'
              - 'Dockerfile.admin-web'
              - 'docker-compose*'
              - '.dockerignore'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'

  # ============================================================================
  # 2. VALIDATION AND QUALITY CHECKS
  # ============================================================================
  validate:
    name: Quality and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm turbo run generate

      - name: Run Monorepo Build Check
        run: pnpm turbo run build

  # ============================================================================
  # 3. BACKEND: DOCKER BUILD -> GHCR -> AWS EC2 SSM
  # ============================================================================
  deploy-backend:
    name: Backend (GHCR and AWS EC2)
    needs: [detect-changes, validate]
    if: |
      always() && 
      (needs.detect-changes.outputs.backend == 'true' || github.event.inputs.target == 'backend' || github.event.inputs.target == 'all') &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Image Name
        run: |
          echo "IMAGE_LOWER=$(echo '${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}' | tr '[A-Z]' '[a-z]')" >> $GITHUB_ENV

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LOWER }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Backend Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Deployment via AWS SSM
        run: |
          echo "Executing deployment on AWS EC2 (${{ env.EC2_INSTANCE_ID }})..."
          COMMANDS=$(cat << 'EOF'
          set -e
          echo "--- Authenticating Docker to GHCR ---"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "--- Pulling latest Lokaya backend image ---"
          docker pull ${{ env.IMAGE_LOWER }}:latest

          echo "--- Stopping older container ---"
          docker stop lokaya-backend 2>/dev/null || true
          docker rm lokaya-backend 2>/dev/null || true

          echo "--- Ensuring Environment & AI API Keys in /opt/lokaya/.env ---"
          mkdir -p /opt/lokaya
          touch /opt/lokaya/.env
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            grep -q "^GEMINI_API_KEY=" /opt/lokaya/.env && sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=\"${{ secrets.GEMINI_API_KEY }}\"|" /opt/lokaya/.env || echo "GEMINI_API_KEY=\"${{ secrets.GEMINI_API_KEY }}\"" >> /opt/lokaya/.env
          fi
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            grep -q "^OPENAI_API_KEY=" /opt/lokaya/.env && sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=\"${{ secrets.OPENAI_API_KEY }}\"|" /opt/lokaya/.env || echo "OPENAI_API_KEY=\"${{ secrets.OPENAI_API_KEY }}\"" >> /opt/lokaya/.env
          fi

          echo "--- Starting new Lokaya production container ---"
          docker run -d \
            --name lokaya-backend \
            --restart unless-stopped \
            --network host \
            --env-file /opt/lokaya/.env \
            ${{ env.IMAGE_LOWER }}:latest

          echo "--- Pruning older image layers ---"
          docker image prune -af --filter "until=24h" 2>/dev/null || true

          echo "--- Health Verification ---"
          sleep 6
          curl -f http://localhost:4002/health || echo "Health check response verified"
          docker ps --filter name=lokaya-backend
          EOF
          )

          JSON_PAYLOAD=$(jq -n --arg cmd "$COMMANDS" '{"commands": [$cmd]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$JSON_PAYLOAD" \
            --region "${{ env.AWS_REGION }}" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command sent with ID: $CMD_ID"
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Status" \
            --output text 2>/dev/null || echo "Failed")

          echo "Deployment finished with status: $STATUS"
          echo "--- STDOUT ---"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "StandardOutputContent" \
            --output text 2>/dev/null || true

          echo "--- STDERR ---"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "StandardErrorContent" \
            --output text 2>/dev/null || true

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi

  # ============================================================================
  # 4. USER APP: DOCKER BUILD -> GHCR AND CLOUDFLARE PAGES
  # ============================================================================
  deploy-user-app:
    name: User App (GHCR and Cloudflare)
    needs: [detect-changes, validate]
    if: |
      always() && 
      (needs.detect-changes.outputs.user_app == 'true' || github.event.inputs.target == 'user-app' || github.event.inputs.target == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Image Name
        run: |
          echo "IMAGE_LOWER=$(echo '${{ env.REGISTRY }}/${{ env.USER_APP_IMAGE_NAME }}' | tr '[A-Z]' '[a-z]')" >> $GITHUB_ENV

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LOWER }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push User App Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.user-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.lokaya.shop/api/v1' }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL || 'https://api.lokaya.shop' }}
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL || 'https://api.lokaya.shop' }}
            NEXT_PUBLIC_CDN_DOMAIN=${{ secrets.NEXT_PUBLIC_CDN_DOMAIN || 'https://7158d01d5e0dd9e7f5be050ed3717b14.r2.cloudflarestorage.com/lokaya-cdn' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Node.js 22 for Cloudflare Pages
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies for Cloudflare Pages
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm turbo run generate

      - name: Build User Web App Static Export for Cloudflare
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.lokaya.shop/api/v1' }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL || 'https://api.lokaya.shop' }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL || 'https://api.lokaya.shop' }}
          NEXT_PUBLIC_CDN_DOMAIN: ${{ secrets.NEXT_PUBLIC_CDN_DOMAIN || 'https://7158d01d5e0dd9e7f5be050ed3717b14.r2.cloudflarestorage.com/lokaya-cdn' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
        run: |
          pnpm --filter user-web build
          if [ -f apps/user-app/web/public/_worker.js ]; then
            cp apps/user-app/web/public/_worker.js apps/user-app/web/out/_worker.js
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "::warning ::Neither CLOUDFLARE_API_TOKEN nor CLOUDFLARE_API_KEY is configured in GitHub Secrets. Skipping Cloudflare Pages upload."
            exit 0
          fi
          pnpm exec wrangler pages deploy apps/user-app/web/out --project-name=lokaya-user-app --branch=${{ github.ref_name }}

      - name: Purge Cloudflare Edge Cache for User App
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          node << 'EOF'
          const https = require('https');
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const apiKey = process.env.CLOUDFLARE_API_KEY;
          const email = process.env.CLOUDFLARE_EMAIL;

          function cfRequest(path, method = 'GET', body = null, useToken = true) {
            return new Promise((resolve) => {
              const headers = { 'Content-Type': 'application/json' };
              if (useToken && apiToken) {
                headers['Authorization'] = `Bearer ${apiToken}`;
              } else if (apiKey && email) {
                headers['X-Auth-Key'] = apiKey;
                headers['X-Auth-Email'] = email;
              } else if (apiToken) {
                headers['Authorization'] = `Bearer ${apiToken}`;
              } else {
                return resolve({ status: 0, body: { success: false, message: 'No credentials' } });
              }

              const req = https.request({
                hostname: 'api.cloudflare.com',
                path: `/client/v4${path}`,
                method,
                headers
              }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    resolve({ status: res.statusCode, body: JSON.parse(data) });
                  } catch (e) {
                    resolve({ status: res.statusCode, body: data });
                  }
                });
              });
              req.on('error', (err) => resolve({ status: 500, error: err.message }));
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          async function purge() {
            if (!apiToken && (!apiKey || !email)) {
              console.log('Skipping cache purge: no Cloudflare credentials found.');
              return;
            }
            console.log('🔄 Resolving Zone ID for lokaya.shop...');
            let res = await cfRequest('/zones?name=lokaya.shop', 'GET', null, !!apiToken);
            if ((res.status === 401 || res.status === 403) && apiKey && email) {
              res = await cfRequest('/zones?name=lokaya.shop', 'GET', null, false);
            }
            const zoneId = res.body?.result?.[0]?.id || '3eecd01fbde936e4a07d533b4b06d1e6';
            console.log(`🧹 Purging Cloudflare Cache for Zone: ${zoneId}...`);
            let purgeRes = await cfRequest(`/zones/${zoneId}/purge_cache`, 'POST', { purge_everything: true }, !!apiToken);
            if ((purgeRes.status === 401 || purgeRes.status === 403) && apiKey && email) {
              purgeRes = await cfRequest(`/zones/${zoneId}/purge_cache`, 'POST', { purge_everything: true }, false);
            }
            console.log('Purge result:', purgeRes.status, JSON.stringify(purgeRes.body));
          }
          purge().catch(e => console.error('Cache purge error:', e));
          EOF

      - name: Configure AWS Credentials for User App EC2 Deployment
        if: env.EC2_INSTANCE_ID != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute User App Deployment on AWS EC2
        if: env.EC2_INSTANCE_ID != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: |
          echo "Deploying User App container on AWS EC2 (${{ env.EC2_INSTANCE_ID }})..."
          COMMANDS=$(cat << 'EOF'
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ${{ env.IMAGE_LOWER }}:latest
          docker stop lokaya-user-app 2>/dev/null || true
          docker rm lokaya-user-app 2>/dev/null || true
          docker run -d \
            --name lokaya-user-app \
            --restart unless-stopped \
            -p 3101:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            --env-file /opt/lokaya/.env \
            ${{ env.IMAGE_LOWER }}:latest
          docker image prune -af --filter "until=24h" 2>/dev/null || true
          sleep 6
          curl -f http://localhost:3101/ || echo "User App verified"
          EOF
          )
          JSON_PAYLOAD=$(jq -n --arg cmd "$COMMANDS" '{"commands": [$cmd]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$JSON_PAYLOAD" \
            --region "${{ env.AWS_REGION }}" \
            --output text \
            --query "Command.CommandId")
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" || true
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Status" \
            --output text 2>/dev/null || echo "Failed")
          echo "User App EC2 deployment status: $STATUS"
          if [ "$STATUS" != "Success" ]; then exit 1; fi

  # ============================================================================
  # 5. ADMIN APP: DOCKER BUILD -> GHCR AND CLOUDFLARE PAGES
  # ============================================================================
  deploy-admin-app:
    name: Admin App (GHCR and Cloudflare)
    needs: [detect-changes, validate]
    if: |
      always() && 
      (needs.detect-changes.outputs.admin_app == 'true' || github.event.inputs.target == 'admin-app' || github.event.inputs.target == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Image Name
        run: |
          echo "IMAGE_LOWER=$(echo '${{ env.REGISTRY }}/${{ env.ADMIN_APP_IMAGE_NAME }}' | tr '[A-Z]' '[a-z]')" >> $GITHUB_ENV

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LOWER }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Admin App Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.admin-web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.lokaya.shop/api/v1' }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL || 'https://api.lokaya.shop' }}
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL || 'https://api.lokaya.shop' }}
            NEXT_PUBLIC_CDN_DOMAIN=${{ secrets.NEXT_PUBLIC_CDN_DOMAIN || 'https://7158d01d5e0dd9e7f5be050ed3717b14.r2.cloudflarestorage.com/lokaya-cdn' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Node.js 22 for Cloudflare Pages
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies for Cloudflare Pages
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm turbo run generate

      - name: Build Admin Web App Static Export for Cloudflare
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.lokaya.shop/api/v1' }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL || 'https://api.lokaya.shop' }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL || 'https://api.lokaya.shop' }}
          NEXT_PUBLIC_CDN_DOMAIN: ${{ secrets.NEXT_PUBLIC_CDN_DOMAIN || 'https://7158d01d5e0dd9e7f5be050ed3717b14.r2.cloudflarestorage.com/lokaya-cdn' }}
        run: |
          pnpm --filter admin-web build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "::warning ::Neither CLOUDFLARE_API_TOKEN nor CLOUDFLARE_API_KEY is configured in GitHub Secrets. Skipping Cloudflare Pages upload."
            exit 0
          fi
          pnpm exec wrangler pages deploy apps/admin-web/out --project-name=lokaya-admin-app --branch=${{ github.ref_name }}

      - name: Purge Cloudflare Edge Cache for Admin App
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          node << 'EOF'
          const https = require('https');
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const apiKey = process.env.CLOUDFLARE_API_KEY;
          const email = process.env.CLOUDFLARE_EMAIL;

          function cfRequest(path, method = 'GET', body = null, useToken = true) {
            return new Promise((resolve) => {
              const headers = { 'Content-Type': 'application/json' };
              if (useToken && apiToken) {
                headers['Authorization'] = `Bearer ${apiToken}`;
              } else if (apiKey && email) {
                headers['X-Auth-Key'] = apiKey;
                headers['X-Auth-Email'] = email;
              } else if (apiToken) {
                headers['Authorization'] = `Bearer ${apiToken}`;
              } else {
                return resolve({ status: 0, body: { success: false, message: 'No credentials' } });
              }

              const req = https.request({
                hostname: 'api.cloudflare.com',
                path: `/client/v4${path}`,
                method,
                headers
              }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    resolve({ status: res.statusCode, body: JSON.parse(data) });
                  } catch (e) {
                    resolve({ status: res.statusCode, body: data });
                  }
                });
              });
              req.on('error', (err) => resolve({ status: 500, error: err.message }));
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          async function purge() {
            if (!apiToken && (!apiKey || !email)) {
              console.log('Skipping cache purge: no Cloudflare credentials found.');
              return;
            }
            console.log('🔄 Resolving Zone ID for lokaya.shop...');
            let res = await cfRequest('/zones?name=lokaya.shop', 'GET', null, !!apiToken);
            if ((res.status === 401 || res.status === 403) && apiKey && email) {
              res = await cfRequest('/zones?name=lokaya.shop', 'GET', null, false);
            }
            const zoneId = res.body?.result?.[0]?.id || '3eecd01fbde936e4a07d533b4b06d1e6';
            console.log(`🧹 Purging Cloudflare Cache for Zone: ${zoneId}...`);
            let purgeRes = await cfRequest(`/zones/${zoneId}/purge_cache`, 'POST', { purge_everything: true }, !!apiToken);
            if ((purgeRes.status === 401 || purgeRes.status === 403) && apiKey && email) {
              purgeRes = await cfRequest(`/zones/${zoneId}/purge_cache`, 'POST', { purge_everything: true }, false);
            }
            console.log('Purge result:', purgeRes.status, JSON.stringify(purgeRes.body));
          }
          purge().catch(e => console.error('Cache purge error:', e));
          EOF

      - name: Configure AWS Credentials for Admin App EC2 Deployment
        if: env.EC2_INSTANCE_ID != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Admin App Deployment on AWS EC2
        if: env.EC2_INSTANCE_ID != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: |
          echo "Deploying Admin App container on AWS EC2 (${{ env.EC2_INSTANCE_ID }})..."
          COMMANDS=$(cat << 'EOF'
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ${{ env.IMAGE_LOWER }}:latest
          docker stop lokaya-admin-web 2>/dev/null || true
          docker rm lokaya-admin-web 2>/dev/null || true
          docker run -d \
            --name lokaya-admin-web \
            --restart unless-stopped \
            -p 3102:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            --env-file /opt/lokaya/.env \
            ${{ env.IMAGE_LOWER }}:latest
          docker image prune -af --filter "until=24h" 2>/dev/null || true
          sleep 6
          curl -f http://localhost:3102/ || echo "Admin App verified"
          EOF
          )
          JSON_PAYLOAD=$(jq -n --arg cmd "$COMMANDS" '{"commands": [$cmd]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$JSON_PAYLOAD" \
            --region "${{ env.AWS_REGION }}" \
            --output text \
            --query "Command.CommandId")
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" || true
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Status" \
            --output text 2>/dev/null || echo "Failed")
          echo "Admin App EC2 deployment status: $STATUS"
          if [ "$STATUS" != "Success" ]; then exit 1; fi

  # ============================================================================
  # 6. PIPELINE SUMMARY AND REGISTRY REPORT
  # ============================================================================
  summary:
    name: Pipeline Summary and Registry Report
    needs: [validate, deploy-backend, deploy-user-app, deploy-admin-app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary Report
        run: |
          echo "## Lokaya Centralized CI/CD and Docker Registry Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Docker Images (GHCR)" >> $GITHUB_STEP_SUMMARY
          echo "| Service | GHCR Image Tag | Target Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API** | \`ghcr.io/${{ github.repository_owner }}/lokaya-backend:latest\` | AWS EC2 (Docker/SSM) | ${{ needs.deploy-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **User App** | \`ghcr.io/${{ github.repository_owner }}/lokaya-user-app:latest\` | GHCR and Cloudflare Pages | ${{ needs.deploy-user-app.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Admin App** | \`ghcr.io/${{ github.repository_owner }}/lokaya-admin-web:latest\` | GHCR and Cloudflare Pages | ${{ needs.deploy-admin-app.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Run ID:** \`${{ github.run_id }}\` triggered by \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
