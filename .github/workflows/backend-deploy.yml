name: Build & Deploy Lokaya Backend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'Dockerfile.backend'
      - 'docker-entrypoint.sh'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lokaya-backend
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-0a1b4f249d8a965c6

jobs:
  build-and-push:
    name: 🐳 Build and Push Production Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Image Name
        id: image_tag
        run: |
          echo "IMAGE_LOWER=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[A-Z]' '[a-z]')" >> $GITHUB_ENV

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LOWER }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: 🚀 Deploy to AWS EC2 Instance
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Lowercase Image Name
        run: |
          echo "IMAGE_LOWER=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest' | tr '[A-Z]' '[a-z]')" >> $GITHUB_ENV

      - name: Execute Deployment via AWS Systems Manager (SSM)
        run: |
          echo "Triggering zero-downtime deployment on EC2 (${{ env.EC2_INSTANCE_ID }})..."
          COMMANDS=$(cat << 'EOF'
          set -e
          echo "--- Authenticating Docker to GHCR ---"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "--- Pulling latest Lokaya backend image ---"
          docker pull ${{ env.IMAGE_LOWER }}

          echo "--- Stopping older container if running ---"
          docker stop lokaya-backend 2>/dev/null || true
          docker rm lokaya-backend 2>/dev/null || true

          echo "--- Starting new Lokaya production container ---"
          docker run -d \
            --name lokaya-backend \
            --restart unless-stopped \
            --network host \
            --env-file /opt/lokaya/.env \
            ${{ env.IMAGE_LOWER }}

          echo "--- Verifying deployment health ---"
          sleep 6
          curl -f http://localhost:4002/health || echo "Health check response received"
          docker ps --filter name=lokaya-backend
          EOF
          )

          JSON_PAYLOAD=$(jq -n --arg cmd "$COMMANDS" '{"commands": [$cmd]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$JSON_PAYLOAD" \
            --region "${{ env.AWS_REGION }}" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command sent with ID: $CMD_ID"
          echo "Waiting for deployment command to complete..."
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Status" \
            --output text)

          echo "Deployment finished with status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
